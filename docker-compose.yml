version: "3.8"

services:
  agy2api:
    build: .
    container_name: agy2api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8008"
      HOST: "0.0.0.0"
    volumes:
      - ./app/data:/app/app/data
      - ~/.gemini:/root/.gemini
      - ~/.agy2api-pool:/root/.agy2api-pool
    ports:
      - "127.0.0.1:${AGY2API_PORT:-8008}:8008"
    networks:
      - default

networks:
  default:
    name: voicebot_default
    external: true
